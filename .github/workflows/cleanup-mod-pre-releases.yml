# Mica Technologies standard pre-release cleanup — canonical copy from dev-configurations
# (minecraft-mod-workflows/template/). Nothing here is expected to change per repo.
#
# The workflow_run trigger matches the release workflow by its `name:`. Rename that workflow and
# this one silently stops running.
#
# Known risk: delete-older-releases@v0.3.2 declares `using: node20` and has no newer release, so
# GitHub force-runs it on Node 24 — the same condition the publish action was under when it
# started losing assets. It has run green so far and only ever touches pre-releases, so it is
# left alone. If it misbehaves, replace it with a `gh release list` / `gh release delete` step
# rather than looking for a newer tag that does not exist (see the README).
name: Cleanup Old/Outdated Mod Pre-Release(s)

on:
  workflow_run:
    workflows: [ "Build Mod Release/Pre-Release (Main Branch)" ]
    types:
      - completed

# Deleting a pre-release, and its tag, is a write, so this needs the same grant as the release
# workflow: repos created since 2023 default GITHUB_TOKEN to read-only. Without it the job still
# goes green while nothing is old enough to delete, then fails the first time something is.
permissions:
  contents: write

jobs:
  cleanup_pre_release:
    name: Cleanup Old/Outdated Mod Pre-Release(s)
    runs-on: ubuntu-latest
    steps:
      - name: Delete old pre-releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          delete_expired_data: '90'       # Delete releases older than 90 days
          delete_prerelease_only: 'true'  # Only target pre-releases
          keep_latest: '3'                # Keep the latest 3 pre-releases minimum
          keep_min_download_counts: '5'   # Keep all pre-releases with at least 5 downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
